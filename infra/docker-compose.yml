services:
  db:
    image: postgres:16-alpine
    container_name: foodgram-db
    volumes:
      - pg_data:/var/lib/postgresql/data/
    env_file:
      - ../backend/.env
    restart: always

  backend:
    build: ../backend
    container_name: foodgram-backend
    env_file:
      - ../backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ../data:/app/data
    restart: always

volumes:
  pg_data:
  static_volume:
  media_volume:
